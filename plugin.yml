name: ZaxConvert
version: 1.0.0
main: com.zaxconvert.ZaxConvert
api-version: 1.21
description: A Minecraft plugin framework for converting Java resource packs to Bedrock format with support for Nexo, ItemsAdder, and Oraxen
author: ZaxConvert Team
website: https://zaxconvert.com

commands:
  zc:
    description: Main ZaxConvert command for conversions
    usage: /zc <convert|reload|help|info|setup>
    aliases: [zinv]
  zinv:
    description: Inventory management for ZaxConvert
    usage: /zinv
    aliases: [zc]

permissions:
  zaxconvert.use:
    description: Base permission to use ZaxConvert commands
    default: true
  zaxconvert.convert:
    description: Allows use of /zc convert
    default: op
  zaxconvert.reload:
    description: Allows use of /zc reload
    default: op
  zaxconvert.info:
    description: Allows use of /zc info
    default: true
  zaxconvert.setup:
    description: Allows use of /zc setup
    default: op
  zaxconvert.inventory:
    description: Allows use of /zinv
    default: true